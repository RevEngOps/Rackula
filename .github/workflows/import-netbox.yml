name: Import NetBox Devices

on:
  workflow_dispatch:
    inputs:
      vendor:
        description: 'Vendor name (case-sensitive, e.g., Ubiquiti, Dell, Synology)'
        required: true
        type: string
      slug:
        description: 'Device slug to import (NetBox YAML filename; leave empty for all)'
        required: false
        type: string
      write:
        description: 'Write device definitions into the brand pack file (--write)'
        required: false
        type: boolean
        default: true
      category:
        description: 'Force a category for all devices (leave empty to auto-detect)'
        required: false
        type: string
      dry_run:
        description: 'Dry run only (no changes)'
        required: false
        type: boolean
        default: true

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run import script
        id: import
        run: |
          FLAGS="--vendor ${{ inputs.vendor }}"

          if [ -n "${{ inputs.slug }}" ]; then
            FLAGS="$FLAGS --slug ${{ inputs.slug }}"
          else
            FLAGS="$FLAGS --all"
          fi

          if [ "${{ inputs.write }}" = "true" ]; then
            FLAGS="$FLAGS --write"
          fi

          if [ -n "${{ inputs.category }}" ]; then
            FLAGS="$FLAGS --category ${{ inputs.category }}"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi

          echo "Running: npx tsx scripts/import-netbox-devices.ts $FLAGS"
          npx tsx scripts/import-netbox-devices.ts $FLAGS

      - name: Process images
        if: inputs.dry_run == false
        run: npm run process-images

      - name: Generate bundled images manifest
        if: inputs.dry_run == false
        run: npm run generate-bundled-images

      - name: Check for changes
        if: inputs.dry_run == false
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: inputs.dry_run == false && steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'feat(devices): import ${{ inputs.vendor }} devices from NetBox'
          title: 'feat(devices): Import ${{ inputs.vendor }} devices from NetBox'
          body: |
            ## Summary
            Automated import of ${{ inputs.vendor }} devices from the NetBox devicetype-library.

            **Vendor:** ${{ inputs.vendor }}
            **Device:** ${{ inputs.slug || 'All available' }}
            **Write to brand pack:** ${{ inputs.write }}
            **Forced category:** ${{ inputs.category || 'auto-detect' }}

            ## Checklist
            - [ ] Review imported device definitions (brand pack `.ts` + `index.ts`)
            - [ ] Verify auto-detected categories are correct (re-run with `category` to override)
            - [ ] Verify images render correctly
            - [ ] Run tests locally

            ---
            🤖 Generated by NetBox Import Action
          branch: import/${{ inputs.vendor }}-devices
          labels: feature,area:devices
